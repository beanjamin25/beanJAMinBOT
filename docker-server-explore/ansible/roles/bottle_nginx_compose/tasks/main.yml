---
- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ bottle_deploy_dir }}"
    state: directory
    mode: "0755"

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    mode: "0755"

- name: Sync Dockerfile context to remote host
  ansible.builtin.synchronize:
    src: "{{ bottle_build_context }}/"
    dest: "{{ bottle_deploy_dir }}/build/"
    delete: true
    rsync_opts:
      - "--exclude=ansible"
      - "--exclude=logs"
      - "--exclude=.env"

- name: Build the Docker image
  community.docker.docker_image:
    name: "{{ bottle_image_name }}"
    tag: "{{ bottle_image_tag }}"
    source: build
    build:
      path: "{{ bottle_deploy_dir }}/build"
      pull: true
    force_source: true

- name: Template docker-compose.yml to remote host
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ bottle_deploy_dir }}/docker-compose.yml"
    mode: "0644"
  register: compose_file

- name: Deploy with docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ bottle_deploy_dir }}"
    state: present
    recreate: "{{ 'always' if compose_file.changed else 'never' }}"
